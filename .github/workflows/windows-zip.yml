name: Windows customer ZIP

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify customer source
        shell: pwsh
        run: node verify-package.js .

      - name: Install production backend dependencies
        shell: pwsh
        run: npm ci --omit=dev --prefix backend

      - name: Test customer gateway accounting
        shell: pwsh
        run: node --test backend/test/customerGatewayIdempotency.test.js

      - name: Assemble ZIP contents
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'xiaoqiange-package'
          Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $package -ItemType Directory | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git', '.github', 'release') } | ForEach-Object {
            Copy-Item $_.FullName $package -Recurse -Force
          }
          node "$package/verify-package.js" $package
          New-Item release -ItemType Directory -Force | Out-Null
          $version = (Get-Content "$package/VERSION").Trim()
          Compress-Archive -Path "$package/*" -DestinationPath "release/XiaoQianDramaFactory-v$version-windows-x64.zip" -CompressionLevel Optimal
          $zip = Get-Item "release/XiaoQianDramaFactory-v$version-windows-x64.zip"
          $line = "$((Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower())  $($zip.Name)" + "`n"
          $bootstrap = Join-Path $env:RUNNER_TEMP 'xiaoqiange-bootstrap'
          Remove-Item $bootstrap -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $bootstrap -ItemType Directory | Out-Null
          @('start.bat', 'stop.bat', 'launcher.js', 'update-runner.js', 'README.md', 'LICENSE', 'VERSION', 'PACKAGE-MANIFEST.json') | ForEach-Object {
            Copy-Item (Join-Path $package $_) (Join-Path $bootstrap $_) -Force
          }
          New-Item (Join-Path $bootstrap 'backend/src/services') -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $package 'backend/src/services/updateService.js') (Join-Path $bootstrap 'backend/src/services/updateService.js') -Force
          Copy-Item (Join-Path $package 'frontend') (Join-Path $bootstrap 'frontend') -Recurse -Force
          $bootstrapZip = Join-Path (Join-Path (Get-Location) 'release') "XiaoQianDramaFactory-v$version-bootstrap-windows-x64.zip"
          Compress-Archive -Path "$bootstrap/*" -DestinationPath $bootstrapZip -CompressionLevel Optimal
          $bootstrapLine = "$((Get-FileHash $bootstrapZip -Algorithm SHA256).Hash.ToLower())  $((Get-Item $bootstrapZip).Name)" + "`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release/SHA256SUMS.txt'), $line + $bootstrapLine, [System.Text.UTF8Encoding]::new($false))
          node "$package/create-update-manifest.js" $version $zip.FullName "$((Get-Location).Path)/release/latest.json"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoqiange-drama-factory-windows-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/SHA256SUMS.txt
            release/latest.json
          generate_release_notes: true
